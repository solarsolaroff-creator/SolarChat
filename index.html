<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SolarChat — на паузе</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #09080d;
      color: #f5f1fa;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      position: relative;
    }

    body::before,
    body::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: .25;
      pointer-events: none;
    }

    body::before {
      width: 320px;
      height: 320px;
      background: #8b5cf6;
      top: -100px;
      left: -80px;
    }

    body::after {
      width: 300px;
      height: 300px;
      background: #38bdf8;
      right: -100px;
      bottom: -100px;
    }

    .card {
      width: min(92vw, 560px);
      padding: 42px 30px;
      text-align: center;
      border: 1px solid #302c38;
      border-radius: 28px;
      background: rgba(23, 21, 29, .86);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .42);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      position: relative;
      z-index: 1;
    }

    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 22px;
      border-radius: 24px;
      display: grid;
      place-items: center;
      font-size: 38px;
      background: linear-gradient(135deg, #a78bfa, #38bdf8);
      box-shadow: 0 14px 40px rgba(124, 92, 246, .28);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(30px, 7vw, 46px);
      letter-spacing: -1.5px;
    }

    p {
      margin: 0 auto;
      max-width: 430px;
      color: #aaa4b2;
      line-height: 1.65;
      font-size: 16px;
    }

    .badge {
      display: inline-block;
      margin-top: 24px;
      padding: 9px 15px;
      border-radius: 999px;
      background: #211e29;
      border: 1px solid #302c38;
      color: #d9d2e2;
      font-size: 13px;
    }

    .footer {
      margin-top: 28px;
      color: #77717f;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">☀️</div>

    <h1>SolarChat CLOSED</h1>

    <p>
      Мессенджер временно закрыт.<br>
      Проект поставлен на паузу. Возможно, мы вернёмся через несколько дней —
      а возможно, немного позже.
    </p>

    <div class="badge">🔒</div>

    <div class="footer">
      Спасибо, что заглянули ❤️
    </div>
  </main>
</body>
</html>
